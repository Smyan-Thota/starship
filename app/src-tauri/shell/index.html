<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starship</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #191919; color: #e6e6e6; font: 14px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #label { font-size: 15px; }
  #detail { color: #8a8a8a; font: 12px ui-monospace, Menlo, monospace; max-width: 80%; text-align: center; word-break: break-word; }
</style>
</head>
<body>
<div id="label">Starting engine</div>
<div id="detail"></div>
<script>
  function setStatus(label, detail) {
    document.getElementById('label').textContent = label;
    document.getElementById('detail').textContent = detail || '';
  }
</script>
</body>
</html>
